[project]
name = "frankenbote"
dynamic = ["version"] 
description = "Personal weekly news digest for Franconia, Bavaria and Germany"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Andreas Werner" },
]
dependencies = [
    # Pipeline core
    "feedparser>=6.0.11",       # RSS/Atom feed parsing
    "trafilatura>=2.0",         # Article body extraction from HTML pages
    "httpx>=0.28.0",            # Modern HTTP client
    "pyyaml>=6.0.2",            # YAML config files
    "python-dotenv>=1.0.1",     # Load .env into environment
    "jinja2>=3.1.4",            # HTML templating
    "pydantic>=2.9.0",          # Config validation
    # AI
    "anthropic>=0.97.0",        # Anthropic API client
    "openai>=3.14.0",           # OpenAI API client
    # Publishing
    "paramiko>=3.5.0",          # SFTP for upload to webserver
    # CLI
    "click>=8.1.7",             # Command-line argument parsing
    "tzdata>=2024.1",           # IANA timezone database (in case the OS lacks it)
]

[project.scripts]
frankenbote = "frankenbote.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/frankenbote"]
omit = [
    "*/cli.py",        # thin coordinator; low value to mock
    "*/publisher.py",  # SFTP upload; requires a live server
    "*/__main__.py",   # entry-point boilerplate
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.setuptools_scm]
# git tag is the single source of truth — no config needed


[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9/F) plus the two rulesets we actually act on:
# UP (pyupgrade — e.g. PEP 695 generics) and TRY (exception handling).
# Pinned here rather than left to each editor's settings, so a local run and
# an editor squiggle report the same thing.
select = ["E4", "E7", "E9", "F", "UP", "TRY"]
ignore = [
    # Config loaders deliberately raise ValueError with a message meant to be
    # shown to the CLI user verbatim (see AGENTS.md, "Config"). TRY003 flags
    # every one of them; the convention is the design, not an oversight.
    "TRY003",
]

[tool.pyright]
# src only: `tests/` builds pydantic models from literals ("local" for a
# Category, a str for HttpUrl, a dict for Window). Pydantic coerces those at
# runtime, but pyright types __init__ from the field annotations and reports
# ~190 false positives. Not worth muting rule by rule.
include = ["src"]
# `include` alone does not quiet the editor: Pylance analyses whatever file
# you have open, in or out of scope. `ignore` suppresses the diagnostics for
# those paths too, so a test file open in VS Code stays clean.
ignore = ["tests"]
pythonVersion = "3.14"
# Matches Pylance's default typeCheckingMode in VS Code, so the CLI and the
# editor agree.
typeCheckingMode = "standard"
